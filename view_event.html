<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Event Organizer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #212529;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .event-title {
            font-size: 2rem;
            color: #343a40;
            text-align: center;
            margin-bottom: 1rem;
        }
        .event-details {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            color: #495057;
        }
        .event-details strong {
            color: #343a40;
        }
        .action-buttons {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="event-title">{{ event.name }}</h1>
        <div class="event-details">
            <p><strong>Date:</strong> {{ event.date }}</p>
            <p><strong>Location:</strong> {{ event.location }}</p>
            <p><strong>Description:</strong> {{ event.description }}</p>
        </div>

        <div class="action-buttons">
            <a href="/dashboard/{{ user_id }}" class="btn btn-secondary">Back to Dashboard</a>
            <a href="mailto:?subject=Check out this event!&body=Event: {{ event.name }}%0D%0ADate: {{ event.date }}%0D%0ALocation: {{ event.location }}" class="btn btn-primary">Share via Email</a>
        </div>
    </div>

</body>
</html>
